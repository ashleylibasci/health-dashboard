name: HealthDashboard
options:
  bundleIdPrefix: com.ashleylibasci.healthdashboard.next
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HealthCore:
    path: Packages/HealthCore
targets:
  HealthDashboard:
    type: application
    platform: iOS
    sources:
      - HealthDashboard
      - Shared
    dependencies:
      - package: HealthCore
      - target: HealthDashboardWatch
      - target: HealthDashboardWidgets
    scheme:
      testTargets:
        - HealthDashboardUITests
    entitlements:
      path: HealthDashboard/Resources/HealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.ashleylibasci.healthdashboard]
    info:
      path: HealthDashboard/Resources/Info.plist
      properties:
        CFBundleDisplayName: Health Next
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Reads your sleep, heart rate, HRV, daylight, steps, wrist temperature and cycle data to learn your sleep need, best wake time and energy curve. Everything stays on your phone."
        NSHealthUpdateUsageDescription: "Saves the caffeine and water you log to Apple Health."
        NSCalendarsFullAccessUsageDescription: "Health Next looks for exams on your calendar (events with exam, midterm, final, quiz or test in the title) so it can plan your sleep around them. It never changes your calendar, and events stay on your phone."
        NSAlarmKitUsageDescription: "Health Next sets a backup alarm on your iPhone at your smart alarm's latest time, in case your Watch can't wake you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleylibasci.healthdashboard.next
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (portrait-locked)
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "AlarmKit"]   # AlarmKit is iOS 26+; the app targets 17
        DEVELOPMENT_TEAM: 93C3VKR4FJ   # Ashley Libasci (Personal Team)
        CODE_SIGN_STYLE: Automatic
  HealthDashboardWatch:
    type: application
    platform: watchOS
    sources:
      - HealthDashboardWatch
      - Shared
    dependencies:
      - package: HealthCore
      - target: HealthDashboardWatchWidgets
    entitlements:
      path: HealthDashboardWatch/HealthDashboardWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.ashleylibasci.healthdashboard]
    info:
      path: HealthDashboardWatch/Info.plist
      properties:
        CFBundleDisplayName: Health Next
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ashleylibasci.healthdashboard.next
        WKBackgroundModes: [alarm]
        NSHealthShareUsageDescription: "Reads your heart rate and sleep to time your smart alarm and energy curve."
        NSHealthUpdateUsageDescription: "Saves the caffeine you log to Apple Health."
        NSMotionUsageDescription: "Watches for movement during your wake window so the smart alarm can wake you from light sleep."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleylibasci.healthdashboard.next.watchkitapp
        DEVELOPMENT_TEAM: 93C3VKR4FJ   # Ashley Libasci (Personal Team)
        CODE_SIGN_STYLE: Automatic
  HealthDashboardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HealthDashboardWidgets
      - Shared/WidgetSnapshot.swift
      - Shared/Theme.swift
      - Shared/LogLatteIntent.swift
    entitlements:
      path: HealthDashboardWidgets/HealthDashboardWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ashleylibasci.healthdashboard]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: HealthDashboardWidgets/Info.plist
      properties:
        CFBundleDisplayName: Health Next
        NSHealthUpdateUsageDescription: "Saves the latte you log from the widget to Apple Health."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleylibasci.healthdashboard.next.widgets
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 93C3VKR4FJ   # Ashley Libasci (Personal Team)
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  HealthDashboardWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - HealthDashboardWatchWidgets
      - Shared/WidgetSnapshot.swift
      - Shared/Theme.swift
    entitlements:
      path: HealthDashboardWatchWidgets/HealthDashboardWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ashleylibasci.healthdashboard]
    info:
      path: HealthDashboardWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Health Next
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleylibasci.healthdashboard.next.watchkitapp.widgets
        DEVELOPMENT_TEAM: 93C3VKR4FJ   # Ashley Libasci (Personal Team)
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  HealthDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HealthDashboardUITests
    dependencies:
      - target: HealthDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleylibasci.healthdashboard.next.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 93C3VKR4FJ   # Ashley Libasci (Personal Team)
        CODE_SIGN_STYLE: Automatic
